<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Prototype</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #222;
		}

		/* The area available after accounting for the phone's safe insets. */
		.stage {
			position: fixed;
			inset: 0;
			padding:
				env(safe-area-inset-top)
				env(safe-area-inset-right)
				env(safe-area-inset-bottom)
				env(safe-area-inset-left);
			display: grid;
			place-items: center;
			overflow: hidden;
		}

		/* JS positions this at the centre and sets its scale. */
		.prototype {
			width: 375px;
			height: 812px;
			flex: none;
			transform-origin: centre;
		}

		.prototype iframe {
			display: block;
			width: 375px;
			height: 812px;
			border: 0;
		}
	</style>
</head>
<body>
	<main class="stage" id="stage">
		<div class="prototype" id="prototype">
			<iframe
				src="https://embed.figma.com/proto/atqGJZcVlOh2gAnQ9kXqv2/Home-Delivery-Exploration?node-id=1083-439534&starting-point-node-id=1083-439534&page-id=867-231740&scaling=scale-down-width&content-scaling=fixed&hide-ui=1&embed-host=primark-proto"
				title="Figma prototype"
				allowfullscreen
			></iframe>
		</div>
	</main>

	<script>
		const frameWidth = 375;
		const frameHeight = 812;
		const stage = document.getElementById('stage');
		const prototype = document.getElementById('prototype');

		function fitPrototype() {
			const styles = getComputedStyle(stage);
			const availableWidth =
				stage.clientWidth -
				parseFloat(styles.paddingLeft) -
				parseFloat(styles.paddingRight);
			const availableHeight =
				stage.clientHeight -
				parseFloat(styles.paddingTop) -
				parseFloat(styles.paddingBottom);

			const scale = Math.min(
				availableWidth / frameWidth,
				availableHeight / frameHeight
			);

			prototype.style.transform = `scale(${scale})`;
		}

		new ResizeObserver(fitPrototype).observe(stage);
		fitPrototype();
	</script>
</body>
</html>
